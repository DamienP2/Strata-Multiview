[workspace]
resolver = "2"
members = ["crates/strata-mv-core", "crates/strata-mv-render", "crates/strata-mv-output", "crates/strata-mv-server", "crates/strata-mv-tray"]

[workspace.package]
version = "0.7.1"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
strata-mv-core = { path = "crates/strata-mv-core" }
strata-mv-render = { path = "crates/strata-mv-render" }
strata-mv-output = { path = "crates/strata-mv-output" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
